name: pages
# Builds and publishes the documentation site (default build: no Wizards fonts or symbol artwork —
# see ADR-0006). Runs on every push to main, or manually. Enable it in the repository settings:
# Settings → Pages → Source: GitHub Actions.
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Never pass --private-assets here: that build embeds Wizards assets and must not be published.
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
