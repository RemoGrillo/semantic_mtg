name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Fixtures, examples and generated vocab are committed, so CI validates without downloading dumps.
      - run: npm run validate
      - run: npm run infer
      - run: npm run cq
      - run: npm test
      # The documentation site, built and checked in headless Firefox (see tools/docs/smoke.mjs).
      - run: npm run docs:build
      - run: npm run docs:smoke -- --require
      # Portable JRE + ROBOT are downloaded by `npm run reason`; cache them between runs.
      - uses: actions/cache@v4
        with:
          path: .tools
          key: reasoning-tools-${{ runner.os }}-jre21-robot
      - run: npm run reason
